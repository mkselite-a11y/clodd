# Config file for an example Majora's Mask: Recompiled mod.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod. Pick something long enough that it'll never be the same as any other mod.
# The name displayed in the mod management menu is separate from this so this doesn't need to be human readable.
id = "global_events_cheats"

# Version of this mod.
version = "3.1.8"

# The name that will show up for this mod in the mod menu. This should be human readable.
display_name = "Global Events Mod v3 + Cheats"

# The description that will show up when this mod is displayed in the mod menu. This should be human readable.
description = """\
Every couple of minutes, a random event hits wherever you are in Termina. 46 events: Bomb Rain, Rupoor Rain, Blood Moon, Joke Event, Moonfall, The Stalker, Phantom Army, Treasure Hunt, Blood Hunger, Searchlights, Terrible Fate, Red Light Green Light, Echo, Champion Duel, Infighting, Time Moves w/ You, Carpenter Uprising, Procession of the Dead, Bullet Hell, Mirage, Mirror Dance, Sky Leviathan, Tingle Air Raid, Cursed Tag, Pop Quiz, Low Gravity, Moonlit Prey, Starfall Bounty, Dowsing Moon, Giant's Gale, Sinking Sands, Frostbite, Scythe Sweep, Moth Swarm, Hex of Silence, Moon Tether, Moon's Grasp, Heartbeat Hex, Moon's Reflex Test, Gorgon's Gaze, Dissonance, Mirror Madness, Volley of Stars, Sleeping Giant, Mask Salesman's Game, Pressure Seals. Each one has its own counter: learn it and you'll get through.

The Moon systems: Moon Marks from bounties, contracts and Nemeses; a Bounty Board with roaming targets that live across Termina's areas; a Nemesis that hunts you, grows, and remembers its wounds; a Moon Shop and Moon Pouch (L + D-pad); a Mutator Deck drafted at each dawn and dusk; and a Cycle Curse for every three days.

Friend Link: friends open a web panel and mess with you, each with their own chaos points. They can start events, steer some of them, aim air strikes and ambushes on a live radar, and hide surprises anywhere in Termina. You decide in the Friends tab what each friend may do: Full, Helpful or Blocked. This mod needs CUSTOM_GlobalEventsRemote.dll next to it (from the same release) to load.

Open the menu by pressing L near any owl statue or the rainbow carpenter in South Clock Town, or anywhere by playing C-Up, C-Up, C-Down, C-Down on the ocarina.

This version also has cheat pages: player (god mode, infinite magic and rupees, moon jump, super speed, low gravity), inventory (give any single item or mask, or everything at once, plus songs and upgrades), world (time speed, freeze or kill enemies) and teleports.

Use either Global Events Mod or Global Events Mod + Cheats, not both. Updating from v2: delete the old CUSTOM_global_events_v2 file first."""

# A short description that will show up in this mod's entry in the mod list. This should be human readable and kept short
# to prevent it from being cut off due to the limited space.
short_description = "Global Events plus a cheat menu."

# Authors of this mod.
authors = [ "mkselite" ]

# ID of the target recomp game.
game_id = "mm"

# Minimum version of the target recomp (e.g. Zelda 64: Recompiled) that this mod can run on.
minimum_recomp_version = "1.2.2"

# Dependency mods. Each entry is the mod's ID and then an optional minimum version of the dependency mod.
dependencies = [
# Example dependency:
#    "modname:1.0.0"
]

# Optional dependency mods. This has the same format as `dependencies`, but the game will still start if dependencies in this
# list aren't present. You can query the presence of a given dependency by using `recomp_is_dependency_met` in recomputils.h.
# Calling a function imported from an optional dependency that isn't present will trigger an error.
optional_dependencies = [

]

# Native libraries (e.g. DLLs) and the functions they export.
native_libraries = [
    { name = "CUSTOM_GlobalEventsRemote", funcs = ["ger_init", "ger_state", "ger_poll", "ger_status", "ger_store", "ger_fetch", "ger_friends", "ger_map"] }
]

# Inputs to the mod tool.
[inputs]

# Input elf file to generate a mod from.
elf_path = "build/mod.elf"

# Output mod filename.
mod_filename = "CUSTOM_global_events_cheats_v3"

# Reference symbol files.
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]

# Additional files to include in the mod.
additional_files = [ ]

[[manifest.config_options]]
id = "circle_radius"
name = "Carpenter Loop Size"
description = "How far from the Clock Tower's center the carpenter walks. 0 means measure the tower automatically."
type = "Number"
min = 0
max = 2000
step = 25
precision = 0
percent = false
default = 0

[[manifest.config_options]]
id = "events_on_start"
name = "Events On At Start"
description = "Turn Global Events on automatically every time the game starts, so you don't have to open the menu first."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"
